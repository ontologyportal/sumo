name: TQSP CI

on: workflow_dispatch

permissions:
  contents: read

env:
  VAMPIRE_VERSION: v5.0.1

jobs:
  build_sumo_tptp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ontology
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ontologyportal/sigma-rs
          ref: e3cebe1c5f41beb609eec17853d886bf6ffc58a5
          path: sigma-rs
          persist-credentials: false

      - name: Set up Rust
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sigma-rs
          key: tqsp-ci

      - name: Test TQSP result handling
        working-directory: ontology
        run: python3 -m unittest discover -s .github/scripts -p 'test_tqsp_ci.py' -v

      - name: Build sigma-rs CLI
        working-directory: sigma-rs
        run: cargo +stable build --release --locked --bin sumo --no-default-features --features ask,parallel,alloc-mi

      - name: Translate top SUMO with sigma-rs
        working-directory: ontology
        run: |
          cat > "$RUNNER_TEMP/sigma-config.xml" <<'XML'
          <configuration>
            <preference name="sumokbname" value="SUMO" />
            <kb name="SUMO"></kb>
          </configuration>
          XML
          for dialect in 'tptp fof' 'tff tff'; do
            read -r extension lang <<< "$dialect"
            ../sigma-rs/target/release/sumo \
              --config "$RUNNER_TEMP/sigma-config.xml" --no-db \
              -f Merge.kif translate --lang "$lang" \
              > "SUMO-top.$extension" 2> "SUMO-top.$extension.log"
            cat "SUMO-top.$extension.log"
            if grep -Eq 'ERROR]|^error\[' "SUMO-top.$extension.log"; then
              echo "::error::sigma-rs reported errors translating SUMO-top.$extension"
              exit 1
            fi
            grep -q "^$lang(" "SUMO-top.$extension"
          done

      - name: Upload translation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqsp-translation-diagnostics
          path: ontology/SUMO-top.*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SUMO-top.tptp
          path: ontology/SUMO-top.tptp
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SUMO-top.tff
          path: ontology/SUMO-top.tff
          if-no-files-found: error

  run_vampire:
    strategy:
      fail-fast: false
      matrix:
        logic: [ tptp, tff ]
        test_file: [  SP01S,
                      SP02S,
                      SP03S,
                      SP04S,
                      SP26S,
                      SP37S,
                      TQG01S,
                      TQG02S,
                      TQG03S,
                      TQG05S,
                      TQG06S,
                      TQG07S,
                      TQG08S,
                      TQG09S,
                      TQG10S,
                      TQG11S,
                      TQG12S,
                      TQG13S,
                      TQG14S,
                      TQG15S,
                      TQG16S,
                      TQG17S,
                      TQG18S,
                      TQG19S,
                      TQG20S,
                      TQG21S,
                      TQG22S,
                      TQG23S,
                      TQG24S,
                      TQG26S,
                      TQG29S,
                      TQG30S,
                      TQG31S,
                      TQG32S,
                      TQG33S,
                      TQG34S,
                      TQG35S,
                      TQG37S,
                      TQG38S,
                      TQG47S,
                      TQG48S,
                      TQG49S,
                      TQG50S ]
        exclude:
        - test_file: TQG47S
          logic: tff
        - test_file: TQG48S
          logic: tff
        - test_file: TQG49S
          logic: tff
        - test_file: TQG11S
          logic: tptp
        - test_file: TQG19S
          logic: tptp
        - test_file: TQG20S
          logic: tptp
        - test_file: TQG21S
          logic: tptp
        - test_file: TQG33S
          logic: tptp
    runs-on: ubuntu-latest
    needs: build_sumo_tptp
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          path: ontology
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: SUMO-top.${{ matrix.logic }}
          path: background

      - name: Cache Vampire binary
        id: cache-vampire
        uses: actions/cache@v4
        with:
          path: ~/.local/vampire-bin
          key: vampire-${{ env.VAMPIRE_VERSION }}-linux-x64

      - name: Install Vampire
        if: steps.cache-vampire.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/vampire-bin"
          curl -fsSL -o "$RUNNER_TEMP/vampire.zip" \
            "https://github.com/vprover/vampire/releases/download/${VAMPIRE_VERSION}/vampire-Linux-X64.zip"
          unzip -q "$RUNNER_TEMP/vampire.zip" -d "$HOME/.local/vampire-bin"
          chmod +x "$HOME/.local/vampire-bin/vampire"

      - name: Add Vampire to PATH
        run: |
          echo "$HOME/.local/vampire-bin" >> "$GITHUB_PATH"
          "$HOME/.local/vampire-bin/vampire" --version

      - name: Run Vampire against ${{ matrix.test_file }}.${{ matrix.logic }}
        env:
          VAMPIRE_TIMEOUT: 900
          TEMPLATE_NAME: ${{ matrix.test_file }}.${{ matrix.logic }}
          PROBLEM_NAME: ${{ matrix.test_file }}-top.${{ matrix.logic }}
          BACKGROUND_NAME: SUMO-top.${{ matrix.logic }}
        run: |
          printf "include('background/%s').\n" "$BACKGROUND_NAME" > "$PROBLEM_NAME"
          cat "ontology/tests/TQSP/TPTP/$TEMPLATE_NAME" >> "$PROBLEM_NAME"
          status=0
          vampire --cores 0 --mode portfolio -sched snake_tptp_uns \
            -p tptp --input_syntax tptp --output_axiom_names on \
            -t "$VAMPIRE_TIMEOUT" "$PROBLEM_NAME" > vamp-out.txt 2>&1 || status=$?
          python3 ontology/.github/scripts/tqsp_ci.py \
            --log vamp-out.txt --exit-code "$status" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Vampire problem and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test_file }}.${{ matrix.logic }}.logs
          path: |
            vamp-out.txt
            ${{ matrix.test_file }}-top.${{ matrix.logic }}
          if-no-files-found: warn
