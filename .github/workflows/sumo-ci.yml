name: 'SUMO CI'

on:
  workflow_call:
    inputs:
      vampire_timeout:
        description: 'How long Vampire should run in seconds'
        required: true
        type: string

permissions:
  contents: read

env:
  VAMPIRE_VERSION: v5.0.1

jobs:
  build_sumo_tptp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: ontology
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ontologyportal/sigma-rs
          # Same revision and validation fix as sigma-validation.yml.
          ref: e3cebe1c5f41beb609eec17853d886bf6ffc58a5
          path: sigma-rs
          persist-credentials: false

      - name: Set up Rust
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sigma-rs
          key: sumo-ci

      - name: Fix sigma-rs validation exit status
        working-directory: sigma-rs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/cli/src/cli/validate.rs")
          source = path.read_text()

          old = "\n    hard_error\n}"
          new = "\n    !hard_error\n}"

          if source.count(old) != 1:
              raise SystemExit(
                  "sigma-rs validation code has changed; review this patch."
              )

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Show source context for sigma-rs ingest errors
        working-directory: sigma-rs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/cli/src/main.rs")
          source = path.read_text()
          old = '                    log::error!("ingest: {e}");'
          new = '''                    match &e {
                      sigmakee_rs_sdk::SdkError::Kb(d) =>
                        session.kb().pretty_print_error(d, log::Level::Error),
                      _ => log::error!("ingest: {e}"),
                    }'''

          if source.count(old) != 1:
              raise SystemExit("sigma-rs ingest logging changed; review this patch.")

          path.write_text(source.replace(old, new, 1))
          PY

      - name: Build sigma-rs CLI
        working-directory: sigma-rs
        run: cargo +stable build --release --locked --bin sumo --no-default-features --features ask,parallel,alloc-mi

      - name: Record sigma-rs revision and configure isolated KB
        run: |
          git -C sigma-rs rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/sigma-config.xml" <<'XML'
          <configuration>
            <preference name="sumokbname" value="SUMO" />
            <kb name="SUMO"></kb>
          </configuration>
          XML

      - name: Test CI result handling
        working-directory: ontology
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_ci.py' -v

      - name: Parse all KIF files with sigma-rs
        run: |
          python3 ontology/.github/scripts/pr_ci.py parse \
            --sumo sigma-rs/target/release/sumo --root ontology \
            --config "$RUNNER_TEMP/sigma-config.xml" --output test-results

      - name: Upload syntax test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/TEST-*.xml
          if-no-files-found: warn

      - name: Produce SUMO.fof and SUMO.tff
        working-directory: ontology
        run: |
          mapfile -t constituents < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .github/full-sumo.txt)
          args=()
          for file in "${constituents[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing Full SUMO constituent: $file"
              exit 1
            fi
            args+=(-f "$file")
          done
          for lang in fof tff; do
            ../sigma-rs/target/release/sumo \
              --config "$RUNNER_TEMP/sigma-config.xml" --no-db "${args[@]}" \
              translate --lang "$lang" > "SUMO.$lang" 2> "SUMO.$lang.log"
            cat "SUMO.$lang.log"
            if grep -Eq 'ERROR]|^error\[' "SUMO.$lang.log"; then
              echo "::error::sigma-rs reported errors while translating SUMO.$lang"
              exit 1
            fi
            grep -q "^$lang(" "SUMO.$lang"
          done

      - name: Upload translation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-diagnostics
          path: ontology/SUMO.*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SUMO.fof
          path: ontology/SUMO.fof
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SUMO.tff
          path: ontology/SUMO.tff
          if-no-files-found: error

  run_vampire:
    needs: build_sumo_tptp
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        lang: [fof, tff]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ontology
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: SUMO.${{ matrix.lang }}

      - name: Install Vampire
        run: |
          mkdir -p "$RUNNER_TEMP/vampire"
          curl -fsSL -o "$RUNNER_TEMP/vampire.zip" \
            "https://github.com/vprover/vampire/releases/download/${VAMPIRE_VERSION}/vampire-Linux-X64.zip"
          unzip -q "$RUNNER_TEMP/vampire.zip" -d "$RUNNER_TEMP/vampire"
          chmod +x "$RUNNER_TEMP/vampire/vampire"
          echo "$RUNNER_TEMP/vampire" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vampire/vampire" --version

      - name: Check SUMO consistency with Vampire
        env:
          VAMPIRE_TIMEOUT: ${{ inputs.vampire_timeout }}
          TPTP_LANG: ${{ matrix.lang }}
        run: |
          [[ "$VAMPIRE_TIMEOUT" =~ ^[1-9][0-9]*$ ]]
          status=0
          vampire --cores 0 --mode portfolio -sched snake_tptp_uns \
            -p tptp --input_syntax tptp --output_axiom_names on \
            -t "$VAMPIRE_TIMEOUT" "SUMO.$TPTP_LANG" > vamp-out.txt 2>&1 || status=$?
          python3 ontology/.github/scripts/pr_ci.py check-vampire \
            --log vamp-out.txt --exit-code "$status" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Vampire log and TPTP proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lang }}-logs-and-graphs
          path: vamp-out.txt
          if-no-files-found: warn
